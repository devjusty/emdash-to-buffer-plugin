name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate versions agree
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          DESCRIPTOR_VERSION="$(node -e "
            const source = require('node:fs').readFileSync('src/index.ts', 'utf8');
            const match = source.match(/version:\\s*[\"']([^\"']+)[\"']/);
            if (!match) {
              console.error('Could not parse version from src/index.ts');
              process.exit(1);
            }
            process.stdout.write(match[1]);
          ")"

          if [ "$DESCRIPTOR_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "src/index.ts version ($DESCRIPTOR_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Validate plugin descriptor
        run: pnpm validate

      - name: Build
        run: pnpm build

      - name: Knip
        run: pnpm knip
