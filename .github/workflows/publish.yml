name: Publish

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Prefer a clean install for release builds (npm trusted-publishing guidance).
          package-manager-cache: false

      - name: Validate release tag format
        run: |
          TAG="${{ github.event.release.tag_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "Release tag must start with 'v' (got: $TAG)"; exit 1 ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate versions agree
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          DESCRIPTOR_VERSION="$(node -e "
            const source = require('node:fs').readFileSync('src/index.ts', 'utf8');
            const match = source.match(/version:\\s*[\"']([^\"']+)[\"']/);
            if (!match) {
              console.error('Could not parse version from src/index.ts');
              process.exit(1);
            }
            process.stdout.write(match[1]);
          ")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

          if [ "$DESCRIPTOR_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "src/index.ts version ($DESCRIPTOR_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

          case "$PACKAGE_VERSION" in
            *-*) IS_PRERELEASE_VERSION=true ;;
            *) IS_PRERELEASE_VERSION=false ;;
          esac

          if [ "$IS_PRERELEASE_VERSION" = "true" ] && [ "${{ github.event.release.prerelease }}" != "true" ]; then
            echo "Version $PACKAGE_VERSION is a prerelease, but the GitHub release is not marked as prerelease"
            exit 1
          fi

          if [ "$IS_PRERELEASE_VERSION" = "false" ] && [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "GitHub release is marked prerelease, but version $PACKAGE_VERSION has no prerelease identifier"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate plugin descriptor
        run: pnpm validate

      - name: Build
        run: pnpm build

      - name: Verify package contents
        run: |
          node <<'EOF'
          const { execFileSync } = require("node:child_process");
          const output = execFileSync("npm", ["pack", "--dry-run", "--json"], {
            encoding: "utf8",
            stdio: ["ignore", "pipe", "pipe"],
          });
          const packs = JSON.parse(output);
          // npm <12 returned an array; npm 12+ (Node 24) returns a name-keyed object.
          const pack = Array.isArray(packs)
            ? packs[0]
            : packs[Object.keys(packs)[0]];
          const files = pack.files.map((file) => file.path).sort();
          const expected = [
            "LICENSE",
            "README.md",
            "dist/index.d.mts",
            "dist/index.mjs",
            "dist/manifest.json",
            "dist/plugin.d.mts",
            "dist/plugin.mjs",
            "emdash-plugin.jsonc",
            "package.json",
          ].sort();

          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            console.error("Unexpected npm pack contents.");
            console.error("Expected:", expected);
            console.error("Actual:", files);
            process.exit(1);
          }

          console.log("npm pack contents match allowlist:");
          for (const file of files) console.log(`- ${file}`);
          EOF

      - name: Verify npm package does not already exist
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME"@"$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
            exit 1
          fi

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*)
              npm publish --provenance --access public --tag beta
              ;;
            *)
              npm publish --provenance --access public
              ;;
          esac
